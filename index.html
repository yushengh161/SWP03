<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極簡待辦清單 | To-Do List</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
    }
    /* 自訂平滑過渡 */
    .todo-enter {
      animation: fadeInSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    /* 自訂捲軸樣式 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between p-4 sm:p-6 lg:p-8 selection:bg-indigo-500 selection:text-white">

  <main class="w-full max-w-xl mx-auto bg-white rounded-3xl shadow-xl shadow-slate-200/70 border border-slate-100 overflow-hidden transition-all duration-300">
    <!-- 頂部資訊區 -->
    <header class="bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-700 p-6 sm:p-8 text-white relative">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">待辦事項清單</h1>
          <p id="currentDateDisplay" class="text-indigo-100 text-xs sm:text-sm mt-1 font-medium"></p>
        </div>
        <div class="text-right">
          <span id="progressPercent" class="text-2xl sm:text-3xl font-extrabold">0%</span>
          <p class="text-indigo-200 text-xs font-medium">完成進度</p>
        </div>
      </div>

      <!-- 進度條 -->
      <div class="w-full bg-indigo-950/30 rounded-full h-2.5 mt-5 overflow-hidden">
        <div id="progressBar" class="bg-emerald-400 h-2.5 rounded-full transition-all duration-500 w-0"></div>
      </div>
    </header>

    <section class="p-6 sm:p-8">
      <!-- 新增待辦事項表單 -->
      <form id="todoForm" class="flex items-center gap-2 mb-6">
        <div class="relative flex-1">
          <input
            type="text"
            id="todoInput"
            maxlength="100"
            placeholder="新增想做的事情... (按 Enter 送出)"
            class="w-full pl-4 pr-10 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all placeholder:text-slate-400"
            autocomplete="off"
            required
          />
          <button
            type="button"
            id="clearInputBtn"
            class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1"
            title="清除文字"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>

        <button
          type="submit"
          class="flex items-center justify-center gap-1.5 px-5 py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-sm font-semibold rounded-2xl shadow-md shadow-indigo-200 transition-all duration-200 shrink-0 cursor-pointer"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span>新增</span>
        </button>
      </form>

      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-4 mb-4">
        <!-- 標籤篩選切換 -->
        <nav class="flex items-center gap-1 bg-slate-100/80 p-1 rounded-xl text-xs font-semibold text-slate-500">
          <button type="button" data-filter="all" class="filter-btn active-tab px-3 py-1.5 rounded-lg transition-all duration-150 bg-white text-indigo-600 shadow-sm">
            全部 (<span id="countAll">0</span>)
          </button>
          <button type="button" data-filter="active" class="filter-btn px-3 py-1.5 rounded-lg hover:text-slate-700 transition-all duration-150">
            進行中 (<span id="countActive">0</span>)
          </button>
          <button type="button" data-filter="completed" class="filter-btn px-3 py-1.5 rounded-lg hover:text-slate-700 transition-all duration-150">
            已完成 (<span id="countCompleted">0</span>)
          </button>
        </nav>

        <!-- 清理所有已完成項目按鈕 -->
        <button
          type="button"
          id="clearCompletedBtn"
          class="text-xs font-medium text-slate-400 hover:text-rose-600 transition-colors duration-150 hidden cursor-pointer"
        >
          清除已完成項目
        </button>
      </div>

      <!-- 待辦清單清單區塊 -->
      <ul id="todoList" class="space-y-2.5 max-h-[460px] overflow-y-auto pr-1">
        <!-- JS 動態注入任務項目 -->
      </ul>

      <!-- 無項目空狀態提示 -->
      <div id="emptyState" class="hidden flex-col items-center justify-center py-12 text-center text-slate-400">
        <div class="w-16 h-16 mb-3 rounded-full bg-slate-100 flex items-center justify-center text-slate-300">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
        </div>
        <p class="text-sm font-medium" id="emptyStateText">目前沒有任何待辦事項</p>
        <p class="text-xs text-slate-400 mt-1">在上方輸入框輸入並按下「新增」開始規劃吧！</p>
      </div>
    </section>
  </main>

  <!-- 提示訊息 Toast 浮動視窗 (替代原生 alert) -->
  <div
    id="toastNotification"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur text-white text-xs sm:text-sm px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none translate-y-3 z-50 flex items-center gap-2"
  >
    <span id="toastIcon">✨</span>
    <span id="toastMessage">提示通知</span>
  </div>

  <footer class="mt-6 text-center text-xs text-slate-400 font-medium">
    資料已安全儲存於您的瀏覽器 LocalStorage 中
  </footer>

  <script>
    // 本地儲存鍵值
    const STORAGE_KEY = 'todo_app_data_v1';

    // 應用程式狀態
    let todos = [];
    let currentFilter = 'all';

    // DOM 元素引用
    const todoForm = document.getElementById('todoForm');
    const todoInput = document.getElementById('todoInput');
    const clearInputBtn = document.getElementById('clearInputBtn');
    const todoList = document.getElementById('todoList');
    const emptyState = document.getElementById('emptyState');
    const emptyStateText = document.getElementById('emptyStateText');
    const clearCompletedBtn = document.getElementById('clearCompletedBtn');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const countAll = document.getElementById('countAll');
    const countActive = document.getElementById('countActive');
    const countCompleted = document.getElementById('countCompleted');
    const progressPercent = document.getElementById('progressPercent');
    const progressBar = document.getElementById('progressBar');
    const currentDateDisplay = document.getElementById('currentDateDisplay');
    const toast = document.getElementById('toastNotification');
    const toastMessage = document.getElementById('toastMessage');
    const toastIcon = document.getElementById('toastIcon');

    let toastTimer = null;

    // 顯示客製化提示訊息 (無阻斷式 Toast)
    function showToast(message, icon = '✨') {
      if (toastTimer) clearTimeout(toastTimer);
      toastMessage.textContent = message;
      toastIcon.textContent = icon;
      toast.classList.remove('opacity-0', 'translate-y-3', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-3', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    // 從 LocalStorage 載入資料
    function loadTodosFromStorage() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          todos = JSON.parse(stored);
        } else {
          // 預設示範資料
          todos = [
            { id: 'item_1', text: '完成前端待辦清單開發', completed: true, createdAt: Date.now() - 3600000 },
            { id: 'item_2', text: '測試重新整理後 LocalStorage 是否持久保留', completed: false, createdAt: Date.now() - 1800000 },
            { id: 'item_3', text: '享受一杯香濃的咖啡 ☕', completed: false, createdAt: Date.now() }
          ];
          saveTodosToStorage();
        }
      } catch (err) {
        console.error('讀取 LocalStorage 失敗:', err);
        todos = [];
      }
    }

    // 儲存資料至 LocalStorage
    function saveTodosToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (err) {
        console.error('寫入 LocalStorage 失敗:', err);
        showToast('儲存失敗，請確認瀏覽器儲存權限', '⚠️');
      }
    }

    // 更新頂部日期與進度條統計
    function updateStats() {
      const total = todos.length;
      const completed = todos.filter(t => t.completed).length;
      const active = total - completed;

      countAll.textContent = total;
      countActive.textContent = active;
      countCompleted.textContent = completed;

      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
      progressPercent.textContent = `${percentage}%`;
      progressBar.style.width = `${percentage}%`;

      // 是否顯示清除全部已完成按鈕
      if (completed > 0) {
        clearCompletedBtn.classList.remove('hidden');
      } else {
        clearCompletedBtn.classList.add('hidden');
      }
    }

    // 渲染待辦項目清單
    function renderTodos() {
      // 根據當前標籤過濾項目
      const filtered = todos.filter(item => {
        if (currentFilter === 'active') return !item.completed;
        if (currentFilter === 'completed') return item.completed;
        return true;
      });

      // 清空清單容器
      todoList.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        if (currentFilter === 'active') {
          emptyStateText.textContent = '太棒了！所有任務皆已完成 🎉';
        } else if (currentFilter === 'completed') {
          emptyStateText.textContent = '目前尚未有已完成的任務';
        } else {
          emptyStateText.textContent = '目前沒有任何待辦事項';
        }
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');

        filtered.forEach(todo => {
          const li = document.createElement('li');
          li.className = `todo-enter group flex items-center justify-between p-3.5 sm:p-4 rounded-2xl border transition-all duration-200 ${
            todo.completed
              ? 'bg-slate-50/70 border-slate-100 text-slate-400'
              : 'bg-white border-slate-200/80 text-slate-800 shadow-sm hover:border-indigo-200 hover:shadow'
          }`;

          li.innerHTML = `
            <div class="flex items-center gap-3 flex-1 min-w-0 mr-2 cursor-pointer toggle-trigger">
              <button 
                type="button"
                data-id="${todo.id}"
                class="complete-toggle w-6 h-6 rounded-lg flex items-center justify-center border transition-all shrink-0 cursor-pointer ${
                  todo.completed
                    ? 'bg-emerald-500 border-emerald-500 text-white shadow-sm'
                    : 'border-slate-300 hover:border-indigo-500 bg-white'
                }"
                title="${todo.completed ? '標記為未完成' : '標記為已完成'}"
              >
                ${
                  todo.completed
                    ? '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>'
                    : ''
                }
              </button>
              <span class="text-sm font-medium break-all select-none transition-all ${
                todo.completed ? 'line-through text-slate-400' : 'text-slate-700'
              }">
                ${escapeHTML(todo.text)}
              </span>
            </div>

            <div class="flex items-center gap-1 opacity-90 sm:opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
              <button
                type="button"
                data-id="${todo.id}"
                class="delete-btn p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition-all cursor-pointer"
                title="刪除事項"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>
          `;

          todoList.appendChild(li);
        });
      }

      updateStats();
    }

    // 防止 XSS 特殊字元跳脫
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 新增待辦事項
    function addTodo(text) {
      const trimmed = text.trim();
      if (!trimmed) {
        showToast('請輸入有效的事項內容！', '⚠️');
        return;
      }

      const newTodo = {
        id: 'todo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        text: trimmed,
        completed: false,
        createdAt: Date.now()
      };

      todos.unshift(newTodo);
      saveTodosToStorage();
      renderTodos();
      showToast('已新增事項', '✅');
    }

    // 切換完成狀態
    function toggleTodo(id) {
      const item = todos.find(t => t.id === id);
      if (item) {
        item.completed = !item.completed;
        saveTodosToStorage();
        renderTodos();
        if (item.completed) {
          showToast('任務已標記為完成！', '🎉');
        }
      }
    }

    // 刪除單一事項
    function deleteTodo(id) {
      const item = todos.find(t => t.id === id);
      if (!item) return;

      todos = todos.filter(t => t.id !== id);
      saveTodosToStorage();
      renderTodos();
      showToast('已刪除待辦事項', '🗑️');
    }

    // 清除所有已完成項目
    function clearCompletedTodos() {
      const completedCount = todos.filter(t => t.completed).length;
      if (completedCount === 0) return;

      todos = todos.filter(t => !t.completed);
      saveTodosToStorage();
      renderTodos();
      showToast(`已清理 ${completedCount} 個已完成事項`, '🧹');
    }

    // 初始化日期標題
    function initDate() {
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      currentDateDisplay.textContent = now.toLocaleDateString('zh-TW', options);
    }

    // 表單提交事件
    todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      addTodo(todoInput.value);
      todoInput.value = '';
      clearInputBtn.classList.add('hidden');
      todoInput.focus();
    });

    // 輸入框按鍵與清除按鈕切換
    todoInput.addEventListener('input', () => {
      if (todoInput.value.trim().length > 0) {
        clearInputBtn.classList.remove('hidden');
      } else {
        clearInputBtn.classList.add('hidden');
      }
    });

    clearInputBtn.addEventListener('click', () => {
      todoInput.value = '';
      clearInputBtn.classList.add('hidden');
      todoInput.focus();
    });

    // 清單委派點擊事件 (標記完成與刪除)
    todoList.addEventListener('click', (e) => {
      // 點擊刪除按鈕
      const deleteBtn = e.target.closest('.delete-btn');
      if (deleteBtn) {
        const id = deleteBtn.getAttribute('data-id');
        deleteTodo(id);
        return;
      }

      // 點擊核取方塊或整行文字切換完成
      const trigger = e.target.closest('.toggle-trigger');
      if (trigger) {
        const toggleBtn = trigger.querySelector('.complete-toggle');
        if (toggleBtn) {
          const id = toggleBtn.getAttribute('data-id');
          toggleTodo(id);
        }
      }
    });

    // 清除已完成按鈕點擊
    clearCompletedBtn.addEventListener('click', clearCompletedTodos);

    // 篩選頁籤切換
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => {
          b.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
          b.classList.add('hover:text-slate-700');
        });
        btn.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
        btn.classList.remove('hover:text-slate-700');

        currentFilter = btn.getAttribute('data-filter');
        renderTodos();
      });
    });

    // 頁面初次載入
    window.addEventListener('DOMContentLoaded', () => {
      initDate();
      loadTodosFromStorage();
      renderTodos();
    });
  </script>
</body>
</html>
